pid /tmp/talentmatch/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format portal '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
    access_log /dev/stdout portal;
    client_body_temp_path /tmp/talentmatch/client;
    proxy_temp_path /tmp/talentmatch/proxy;
    fastcgi_temp_path /tmp/talentmatch/fastcgi;
    uwsgi_temp_path /tmp/talentmatch/uwsgi;
    scgi_temp_path /tmp/talentmatch/scgi;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        server_name _;
        root /var/www/frontend;
        index index.html;
        client_max_body_size 26m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://media.licdn.com https://*.licdn.com; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:8010;
            proxy_read_timeout 7s;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # App Service terminates public HTTPS. HTTPS Only is mandatory.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }
        location /auth/ {
            # Nginx upstream errors otherwise include OAuth code/state queries.
            error_log /dev/null emerg;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }
        # Only this prefix reaches the isolated Python 3.13.3 finance process.
        # Normalize the bare prefix internally; no HTTP redirect or second port.
        location = /finance {
            rewrite ^ /finance/ last;
        }
        location ^~ /finance/ {
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8020/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /finance;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 35s;
            error_page 502 504 = @finance_unavailable;
            error_page 413 = @finance_payload_too_large;
        }
        location @finance_unavailable {
            default_type application/json;
            set $finance_uncertain false;
            set $finance_retryable true;
            if ($request_method ~ ^(POST|PATCH|DELETE)$) {
                set $finance_uncertain true;
                set $finance_retryable false;
            }
            return 503 '{"success":false,"error":{"code":"finance_unavailable","message":"Finance demo process is unavailable. Verify the exact record before retrying any write.","retryable":$finance_retryable,"outcome_uncertain":$finance_uncertain,"verification_required":$finance_uncertain}}';
        }
        location @finance_payload_too_large {
            default_type application/json;
            return 413 '{"success":false,"error":{"code":"request_too_large","message":"Finance request body exceeds 64 KiB.","retryable":false,"outcome_uncertain":false,"verification_required":false}}';
        }
        # React owns /jobs, /hr and /candidate, including full-page refreshes.
        location /assets/ { expires 1y; try_files $uri =404; }
        location / { expires -1; try_files $uri $uri/ /index.html; }
    }
}
