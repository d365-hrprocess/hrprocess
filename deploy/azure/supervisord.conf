[unix_http_server]
file=/tmp/talentmatch/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
pidfile=/tmp/talentmatch/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
childlogdir=/tmp/talentmatch

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/talentmatch/supervisor.sock

[program:redis]
command=/usr/bin/redis-server /app/azure/redis.conf
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/app/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/python /app/docker/runtime.py worker
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -c /app/azure/nginx.conf -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:readiness]
command=/app/.venv/bin/python /app/azure/runtime.py serve-health
directory=/app
priority=50
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Separate Python 3.13.3 process; deliberately excluded from the HR health check.
[program:finance]
command=/opt/finance/venv/bin/python -m uvicorn finance_demo_api.api:app --host 127.0.0.1 --port 8020 --workers 1 --root-path /finance --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
directory=/opt/finance
priority=60
autostart=true
autorestart=true
startsecs=2
startretries=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
