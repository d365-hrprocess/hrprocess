[project]
name = "ubticareers-finance-demo"
version = "0.1.0"
description = "Isolated temporary D365 finance API for the ubticareers demo"
requires-python = "==3.13.3"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "uvicorn>=0.34,<1",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "swagger-spec-validator>=3.0,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
